# Original model: https://huggingface.co/litagin/anime-whisper
# Experimental conversion: distributor reports possible anomalous transcription.
# Do NOT set an initial prompt for this model. Compare against original weights.
runtime = "whisper_cpp"
task = "asr"
name = "Anime Whisper"
description = "日本語音声認識。VAD短区間・時刻生成OFF・履歴OFF。VAD区間時刻で出力し、強制アライメントは任意。"
[source]
repo = "https://huggingface.co/Aratako/anime-whisper-ggml"
files = ["ggml-anime-whisper.bin"]
[defaults]
language = "ja"

[constraints]
disabled_parameters = ["initial_prompt", "carry_initial_prompt"]

# VAD timestamps describe whole speech regions; optional alignment refines word timing.
[constraints.inference]
segmentation = "vad"
timestamps = false
history = false
max_segment_seconds = 25.0
timestamp_source = "vad"
