schema_version = 2
provider = "audio_cpp"
task = "asr"
family = "sense_asr"
name = "SenseVoice Small · Q8"
sample_rate = 16000
description = "日本語・中国語・英語など。ホスト側でVAD分割し、イベントタグは既定で省略。"

[capabilities]
timestamps = "none"
speakers = false

[execution]
mode = "offline"
output = "text"
max_batch_items = 16
max_audio_seconds = 28

[source]
repo = "FunAudioLLM/SenseVoiceSmall-GGUF-audiocpp"
revision = "5c3fcfe748a8714216bc135476d5863084fddb72"
files = ["sensevoice-small-q8-audiocpp-v1.gguf"]

[source.sha256]
"sensevoice-small-q8-audiocpp-v1.gguf" = "4dedf169f625437fb336f2959674f399819729a765e184128c0e25a6e16ff0ec"

[defaults]
language = "ja"

[defaults.request]
audio_chunk_mode = "none"
enable_itn = true
keep_tags = false

[parameters.enable_itn]
type = "bool"
default = true
ja = "数値などの表記を正規化"
en = "Inverse text normalization"

[parameters.keep_tags]
type = "bool"
default = false
ja = "音声イベント・感情タグを残す"
en = "Keep event and emotion tags"
