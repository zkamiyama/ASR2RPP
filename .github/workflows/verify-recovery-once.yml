# One-time branch-only regression reproduction and exact source edit; remove before merge.
name: Verify clicked GO failure recovery
on:
  push:
    branches: [fix/restart-catalog]
    paths: ['.github/workflows/verify-recovery-once.yml']
permissions:
  contents: write
jobs:
  reproduce:
    if: github.repository == 'zkamiyama/ASR2RPP' && github.ref == 'refs/heads/fix/restart-catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
      ASR2RPP_DISABLE_RUNTIME_BOOTSTRAP: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y libegl1 libopengl0 libxkbcommon0
      - run: python -m pip install pytest PySide6==6.8.3 numpy safetensors
      - name: Reproduce sender-context issue, then separate internal settlement from signal guard
        shell: python
        run: |
          from pathlib import Path
          import hashlib, subprocess, sys
          gui = Path('asr2rpp/gui_dcc.py')
          raw = gui.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == 'b333cd496c9dd899cbe464a1c1cb22652e55bea6'
          tests = Path('tests/test_release_polish.py')
          s = tests.read_text()
          begin = s.index('def test_thread_start_failure_unlocks_go_and_can_retry(')
          end = s.index('\ndef test_bad_configuration', begin)
          block = s[begin:end]
          assert block.count('window.start_work()') == 2
          block = block.replace('window.start_work()', 'window.run_button.click()')
          anchor = "        assert window.entries[0]['status'] == 'failed'\n"
          assert block.count(anchor) == 1
          block = block.replace(anchor, anchor + "        assert window.completed == window._run_ledger.completed == 1\n")
          tests.write_text(s[:begin]+block+s[end:], encoding='utf-8')
          command = [sys.executable, '-m', 'pytest', 'tests/test_release_polish.py::test_thread_start_failure_unlocks_go_and_can_retry', '-q']
          result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print('BEFORE_FIX\n'+result.stdout, flush=True)
          assert result.returncode == 1 and "'waiting' == 'failed'" in result.stdout, 'Expected clicked-GO regression was not reproduced'
          s = raw.decode('utf-8')
          old = "                            self.item_changed(index, 'failed', str(exc))"
          assert s.count(old) == 1
          s = s.replace(old, "                            self._apply_item_event(index, 'failed', str(exc))")
          old = "            return  # A queued signal from a finished attempt must not touch a new one.\n        if self._run_ledger is None"
          new = "            return  # A queued signal from a finished attempt must not touch a new one.\n        self._apply_item_event(index, status, detail)\n\n    def _apply_item_event(self, index, status, detail):\n        # Internal reconciliation may run inside a button slot: it is not a worker signal.\n        if self._run_ledger is None"
          assert s.count(old) == 1
          s = s.replace(old, new)
          old = '                self.item_changed(index, status, detail)'
          assert s.count(old) == 1
          s = s.replace(old, '                self._apply_item_event(index, status, detail)')
          compile(s, str(gui), 'exec')
          gui.write_text(s, encoding='utf-8')
          result = subprocess.run(command, text=True, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          print('AFTER_FIX\n'+result.stdout, flush=True)
          assert result.returncode == 0
          subprocess.run([sys.executable, '-m', 'pytest', 'tests', '-q'], check=True)
          p = Path('README.md')
          s = p.read_text().replace('Open custom TOMLs', 'Open custom TOML')
          p.write_text(s, encoding='utf-8')
      - name: Commit only the tested source changes on this branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/fix/restart-catalog | cut -f1)" = "$EXPECTED_HEAD"
          git diff --check
          git add asr2rpp/gui_dcc.py tests/test_release_polish.py README.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: settle start failures independently of Qt signal sender'
          git push origin HEAD:refs/heads/fix/restart-catalog
