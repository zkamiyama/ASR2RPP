name: Validate big_beta7 torch-free conversion
on:
  workflow_dispatch:
  push:
    branches: [feat/queue-gui]
    paths: ['ci-big-beta7-trigger.txt']
permissions:
  contents: read
jobs:
  convert:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ASR2RPP_HOME: ${{ github.workspace }}/build/big-beta7-home
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install torch-free converter dependencies
        run: python -m pip install numpy safetensors
      - name: Confirm PyTorch is absent
        run: python -c "import importlib.util; assert importlib.util.find_spec('torch') is None"
      - name: Build audio.cpp CLI and GGUF converter
        run: python tools/build_native.py audio_cpp:cpu
      - name: Download, verify and convert big_beta7 automatically
        run: python -m asr2rpp.cli models install mel-big-beta7
      - name: Verify installed artifact and write report
        shell: python
        run: |
          import hashlib, json, os
          from pathlib import Path
          root = Path(os.environ['ASR2RPP_HOME']) / 'weights' / 'mel-big-beta7'
          states = list(root.glob('*/installed.json'))
          assert len(states) == 1, states
          state = json.loads(states[0].read_text(encoding='utf-8'))
          directory = states[0].parent
          output = directory / 'big_beta7-f16.gguf'
          assert output.is_file() and output.stat().st_size > 100 * 1024 * 1024
          assert not (directory / '.conversion').exists()
          assert state['files']['big_beta7.ckpt']['sha256'] == '9d68b9a8689a3500c45d3418a7811934e557760db07285f483088a0965b0eb88'
          assert state['files']['big_beta7-f16.gguf']['size'] == output.stat().st_size
          report = {
              'source_repo': state['repo'],
              'source_revision': state['revision'],
              'source_sha256': state['files']['big_beta7.ckpt']['sha256'],
              'output_sha256': hashlib.sha256(output.read_bytes()).hexdigest(),
              'output_size': output.stat().st_size,
              'conversion': state['conversion'],
              'torch_installed': False,
              'intermediate_removed': True,
          }
          Path('reports').mkdir(exist_ok=True)
          Path('reports/big-beta7-conversion.json').write_text(json.dumps(report, indent=2), encoding='utf-8')
      - name: Real two-file audio.cpp separation batch smoke
        shell: python
        run: |
          import json, math, os, struct, subprocess, time, wave
          from pathlib import Path

          home = Path(os.environ['ASR2RPP_HOME'])
          ggufs = list((home / 'weights' / 'mel-big-beta7').glob('*/big_beta7-f16.gguf'))
          assert len(ggufs) == 1, ggufs
          model = ggufs[0]
          cli = Path('engines/audio_cpp-cpu/audiocpp_cli')
          assert cli.is_file(), cli
          inputs = Path('reports/sep-batch-inputs')
          outputs = Path('reports/sep-batch-outputs')
          inputs.mkdir(parents=True, exist_ok=True)
          outputs.mkdir(parents=True, exist_ok=True)

          def write_test(path, frequency):
              rate = 44100
              frames = rate
              with wave.open(str(path), 'wb') as wav:
                  wav.setnchannels(2)
                  wav.setsampwidth(2)
                  wav.setframerate(rate)
                  payload = bytearray()
                  for n in range(frames):
                      value = int(5000 * math.sin(2 * math.pi * frequency * n / rate))
                      payload += struct.pack('<hh', value, value)
                  wav.writeframes(payload)

          write_test(inputs / 'batch_a.wav', 440.0)
          write_test(inputs / 'batch_b.wav', 660.0)
          started = time.monotonic()
          command = [
              str(cli), '--task', 'sep', '--family', 'mel_band_roformer',
              '--model', str(model), '--backend', 'cpu', '--mode', 'offline',
              '--batch-audio-dir', str(inputs), '--threads', '2',
              '--out-dir', str(outputs),
              '--session-option', 'mel_band_roformer.num_overlap=1',
          ]
          run = subprocess.run(command, text=True, capture_output=True, timeout=1800)
          Path('reports/sep-batch.log').write_text(
              run.stdout + '\\n--- STDERR ---\\n' + run.stderr, encoding='utf-8')
          assert run.returncode == 0, run.stdout[-2000:] + run.stderr[-2000:]
          for name in ('batch_a', 'batch_b'):
              vocal = outputs / name / 'vocals.wav'
              assert vocal.is_file() and vocal.stat().st_size > 44, vocal
              with wave.open(str(vocal), 'rb') as wav:
                  assert wav.getframerate() == 44100
                  assert wav.getnchannels() == 2
                  assert wav.getnframes() > 0
          Path('reports/sep-batch-result.json').write_text(json.dumps({
              'input_count': 2,
              'output_count': 2,
              'single_batch_session': True,
              'backend': 'cpu',
              'elapsed_seconds': time.monotonic() - started,
          }, indent=2), encoding='utf-8')
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: big-beta7-conversion-report-${{ github.run_id }}
          path: reports/
          retention-days: 14
