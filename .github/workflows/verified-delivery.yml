name: Verified portable release artifact
on:
  push:
    branches: [feat/provider-timing-runtime]
    paths: ['release-delivery.json', '.github/workflows/verified-delivery.yml']
permissions:
  contents: read
jobs:
  verified-archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Fetch the exact locally tested immutable release
        shell: python
        run: |
          import hashlib, json, pathlib, re, shutil, urllib.request, zipfile
          data=json.loads(pathlib.Path('release-delivery.json').read_text())
          assert data['repository']=='zkamiyama/ASR2RPP'
          assert re.fullmatch(r'preview-[0-9a-f]{12}-[0-9a-f]{8}',data['tag'])
          assert re.fullmatch(r'[0-9a-f]{64}',data['sha256'])
          out=pathlib.Path('delivery');out.mkdir()
          for name in ('ASR2RPP-Windows-x64.zip','SHA256SUMS.txt','VALIDATION.json'):
              url='https://github.com/'+data['repository']+'/releases/download/'+data['tag']+'/'+name
              with urllib.request.urlopen(url,timeout=60) as response,(out/name).open('wb') as handle:
                  shutil.copyfileobj(response,handle,1024*1024)
          archive=out/'ASR2RPP-Windows-x64.zip'
          with archive.open('rb') as handle:
              assert hashlib.file_digest(handle,'sha256').hexdigest()==data['sha256']
          assert (out/'SHA256SUMS.txt').read_text().split()[0]==data['sha256']
          report=json.loads((out/'VALIDATION.json').read_text())
          assert report['commit']==data['commit'] and report['portable']['passed']
          with zipfile.ZipFile(archive) as package:
              assert json.loads(package.read('ASR2RPP/version.json'))['commit']==data['commit']
              assert not any(pathlib.Path(n).suffix.lower() in {'.ttf','.otf','.ttc','.woff','.woff2'} for n in package.namelist())
              assert package.testzip() is None
          print('Exact tested ZIP verified:',data['sha256'])
      - uses: actions/upload-artifact@v4
        with:
          name: verified-windows-${{ github.run_id }}
          path: delivery/
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
