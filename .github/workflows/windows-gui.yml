name: Native Windows GUI validation
on:
  push:
    branches: [feat/queue-gui]
    paths: ['.github/workflows/windows-gui.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  gui:
    runs-on: windows-2022
    timeout-minutes: 12
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
      ASR2RPP_HOME: ${{ github.workspace }}/build/native-gui-home
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install PySide6==6.8.3 pytest
      - run: python -m pytest tests/test_app.py::test_gui_states_and_screenshots -v --junitxml=reports/native-windows-gui.xml
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-windows-gui-${{ github.run_id }}
          path: reports/
          retention-days: 7
