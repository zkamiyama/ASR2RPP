# Temporary, branch-scoped source-edit job. Remove before merging.
name: Apply reviewed release polish edits
on:
  push:
    branches: [fix/restart-catalog]
    paths: ['.github/workflows/release-polish-once.yml']
permissions:
  contents: write
jobs:
  apply:
    if: github.repository == 'zkamiyama/ASR2RPP' && github.ref == 'refs/heads/fix/restart-catalog'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Apply exact anchored edits to the already reviewed source
        shell: python
        run: |
          from pathlib import Path
          import hashlib
          p = Path('asr2rpp/gui_dcc.py')
          raw = p.read_bytes()
          assert hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest() == 'deae77147eeca1489f39dc732e40774e427202e5'
          s = raw.decode('utf-8')
          old = '        self.setWindowTitle("ASR2RPP")\n'
          assert s.count(old) == 1
          s = s.replace(old, old + '        from .branding import configure_window\n        configure_window(self)\n', 1)
          first = s.index('    def start_work(self, prepare_only=False):')
          last = s.index('    def show_progress(self, value):', first)
          block = s[first:last]
          old = '        except Exception as exc:\n            QMessageBox.warning(self, "ASR2RPP", str(exc))\n'
          new = '''        except Exception as exc:
                      # A failed QThread.start must not leave the GUI permanently busy.
                      # A thread that did start keeps ownership until its finished signal.
                      worker = self.worker
                      if worker is not None:
                          if worker.isRunning():
                              self._stopping = True
                              worker.cancel.set()
                              self.update_state()
                          else:
                              if self._run_ledger is not None:
                                  for index in self._run_ledger.pending:
                                      self.item_changed(index, 'failed', str(exc))
                              self.worker = None
                              self._stopping = False
                              self.set_busy(False)
                              worker.deleteLater()
                      QMessageBox.warning(self, "ASR2RPP", str(exc))
          '''
          assert block.count(old) == 1
          s = s[:first] + block.replace(old, new, 1) + s[last:]
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          p = Path('asr2rpp/lifecycle_smoke.py')
          s = p.read_text()
          old = '            window = gui.MainWindow(preferences=prefs)\n'
          assert s.count(old) == 1
          s = s.replace(old, old + '            assert not window.windowIcon().pixmap(16, 16).isNull()\n            assert not window.windowIcon().pixmap(64, 64).isNull()\n')
          old = "        report = {'passed': True, 'cases': results, 'model_directory': str(model_directory()),"
          assert s.count(old) == 1
          s = s.replace(old, "        report = {'passed': True, 'window_icon_valid': True, 'cases': results, 'model_directory': str(model_directory()),")
          compile(s, str(p), 'exec')
          p.write_text(s, encoding='utf-8')
          p = Path('THIRD_PARTY.md')
          s = p.read_text()
          s += '\n## Executable artwork\n\nApplication and native-tool icon glyphs use Google Material Icons (Apache 2.0).\nASR2RPP adds the background and colors. Full license and provenance are packaged\nin licenses/material-icons and assets/branding/NOTICE.md. No icon font is bundled.\n'
          p.write_text(s, encoding='utf-8')
          p = Path('docs/inference-policy.md')
          s = p.read_text()
          old = '各WAVを `-nt -mc 0` で独立認識し、コマンド長制限付きバッチでモデルを再利用します。'
          assert s.count(old) == 1
          s = s.replace(old, '同梱エンジンにはPCMのサンプル範囲を渡し、`-nt -mc 0` で独立認識します。\n区間WAVを作らずモデルを再利用し、未対応の独自エンジンだけ従来のWAV経路を使います。')
          p.write_text(s, encoding='utf-8')
      - name: Commit only the reviewed source changes on this branch
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -eu
          test "$(git ls-remote origin refs/heads/fix/restart-catalog | cut -f1)" = "$EXPECTED_HEAD"
          git diff --check
          git add asr2rpp/gui_dcc.py asr2rpp/lifecycle_smoke.py THIRD_PARTY.md docs/inference-policy.md
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix: restore idle state on worker start errors and wire application identity'
          git push origin HEAD:refs/heads/fix/restart-catalog
